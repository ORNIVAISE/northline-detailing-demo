<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SIGNAL RUNNER — проверка экранов</title>
<style>*{box-sizing:border-box}body{margin:0;background:#06090e;color:#c8d7e5;font:13px Arial,sans-serif}header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 20px;border-bottom:1px solid #263541}strong{margin-right:16px;font-size:12px;letter-spacing:.15em}button{border:1px solid #334c5c;border-radius:5px;background:#0c1924;color:#c4dce9;padding:10px;cursor:pointer}button[aria-pressed=true]{background:#213e50}main{padding:20px;overflow:auto}iframe{display:block;border:1px solid #354956;background:#050608;margin:0 auto}p{margin:0 0 14px;color:#71869a;text-align:center}</style></head>
<body><header><strong>ØN / LAYOUT CHECK</strong><button data-width="390" data-height="844" aria-pressed="true">Телефон 390</button><button data-width="360" data-height="800" aria-pressed="false">Телефон 360</button><button data-width="844" data-height="390" aria-pressed="false">Альбомный</button><button data-width="1280" data-height="800" aria-pressed="false">Компьютер</button><button id="togglePage">Главная / игра</button></header><main><p id="size">390 × 844</p><iframe id="preview" src="signal-runner-page-test.html" title="Предпросмотр игры" width="390" height="844" allow="fullscreen" allowfullscreen></iframe></main>
<script>const frame=document.getElementById('preview');document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{frame.width=button.dataset.width;frame.height=button.dataset.height;document.getElementById('size').textContent=frame.width+' × '+frame.height;document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)))}));document.getElementById('togglePage').addEventListener('click',()=>frame.src=frame.src.includes('home-test')?'signal-runner-page-test.html':'signal-runner-home-test.html');</script></body></html>
